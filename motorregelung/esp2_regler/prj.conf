# ESP2 (Regler-Knoten) - Zephyr-Einstellungen
# Jede Zeile ist kommentiert, damit klar ist, wofuer sie da ist.

# --- Grundfunktionen ---
CONFIG_GPIO=y
# PWM (beim ESP32 ueber den LEDC-Baustein) fuer die Motor-Geschwindigkeit
CONFIG_PWM=y
# Mathe-Bibliothek (fabsf im Regler)
CONFIG_PICOLIBC=y
# 1 ms Zeitraster, damit der 10-ms-Takt genau ist
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_LOG=y

# --- CAN-Bus (TWAI) ---
CONFIG_CAN=y

# --- WLAN + Netzwerk (UDP) ---
CONFIG_WIFI=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
# zsock_poll() im Empfangs-Thread
CONFIG_ZVFS_POLL_MAX=4
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
# IP-Adresse setzen wir selbst im Code (netzwerk.c), nicht automatisch
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=64
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_MAX_CONTEXTS=8

# Alte Namen (struct in_addr, AF_INET ...) weiter erlauben - Zephyr hat sie umbenannt
CONFIG_NET_NAMESPACE_COMPAT_MODE=y

# Heap fuer den WLAN-Treiber (sonst "memory allocation failed")
CONFIG_HEAP_MEM_POOL_SIZE=98304